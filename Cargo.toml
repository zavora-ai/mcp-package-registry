[package]
name = "mcp-package-registry"
version = "1.0.0"
edition = "2021"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Package Registry MCP Server — dependency metadata, versions, advisories, changelogs, compatibility, and upgrade plans"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-package-registry"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "packages", "dependencies", "crates", "npm"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
adk-mcp-sdk = "0.1"
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
